# Checks the Python dependencies against the PyPA advisory database (pip-audit) every week
# and whenever requirements.txt changes. A failure means a dependency has a known vulnerability.
name: dependency-audit

on:
  push:
    branches: [main]
    paths: ['requirements.txt', '.github/workflows/dependency-audit.yml']
  pull_request:
    paths: ['requirements.txt']
  schedule:
    - cron: '41 5 * * 1'   # weekly, Monday 05:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install the project's dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Audit the installed packages
        run: |
          pip install pip-audit==2.10.1
          pip-audit --progress-spinner off --desc --skip-editable   # our own package isn't on PyPI
