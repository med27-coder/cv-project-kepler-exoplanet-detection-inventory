# Checks the Python dependencies against the PyPA advisory database (pip-audit) every week
# and whenever the requirements or their locks change. It audits the exact versions pinned in the
# hash-locked requirements.lock. A failure means a dependency has a known vulnerability.
name: dependency-audit

on:
  push:
    branches: [main]
    paths: ['requirements*.txt', 'requirements*.lock', '.github/workflows/dependency-audit.yml']
  pull_request:
    paths: ['requirements*.txt', 'requirements*.lock']
  schedule:
    - cron: '41 5 * * 1'   # weekly, Monday 05:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install the project's dependencies
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps -e .
      - name: Audit the installed packages
        run: |
          pip install pip-audit==2.10.1
          pip-audit --progress-spinner off --desc --skip-editable   # our own package isn't on PyPI
