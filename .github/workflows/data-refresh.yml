# Monthly star map refresh: re-downloads NASA's tables (KOI, confirmed planets, TESS objects),
# Gaia stellar properties and spacecraft positions, re-exports the map data with the public
# Star Gazer scores, checks the prediction scoreboard, and opens a pull request if anything
# changed. Nothing is merged automatically.
# Needs: Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
name: data-refresh

on:
  schedule:
    - cron: '0 6 3 * *'   # monthly, the 3rd at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write        # push the refresh branch
      pull-requests: write   # open the pull request
    env:
      KEPLER_ACCEPT_TERMS: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies (hash-checked)
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps -e .
      - name: Download the NASA catalog and Gaia stellar properties
        run: |
          python -c "from kepler_cnn import star_gazer as S; S.load_catalog()"
          python scripts/data/fetch_extra_data.py gaia_stars
      - name: Re-export the star map (downloads the planet and TESS tables)
        run: python scripts/starmap/export_starmap.py
      - name: Update spacecraft positions
        run: python scripts/starmap/fetch_spacecraft.py
      - name: Check the prediction scoreboard
        run: |
          if ls results/scoreboard/scores_*.csv >/dev/null 2>&1; then python scripts/pipeline/scoreboard.py check; fi
      - name: Open a pull request with the changes
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          branch: data-refresh
          delete-branch: true
          commit-message: 'Monthly data refresh (NASA tables, Gaia, spacecraft positions)'
          title: 'Monthly data refresh'
          body: |
            Automated monthly refresh of the star map data from NASA's Exoplanet Archive, Gaia
            (Berger et al. 2020) and JPL Horizons, plus the prediction scoreboard. Review the
            changes, then merge to publish them.
          add-paths: |
            web/data/**
            web/og.png
            results/scoreboard/**
