# Publishes the pixel star map (web/) to GitHub Pages whenever it changes on main.
# web/data/systems.js is committed (built locally by scripts/export_starmap.py), so this
# only uploads static files. One-time setup: repo Settings > Pages > Source: GitHub Actions.
# Actions are pinned to commit SHAs (tag in the comment); Dependabot keeps them up to date.
name: pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions: {}   # nothing by default; the deploy job asks only for what Pages needs

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false
      - name: Check the map data and JavaScript
        run: |
          test -s web/data/systems.js
          node --check web/starmap.js
          node --check web/data/systems.js
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b  # v4
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5
