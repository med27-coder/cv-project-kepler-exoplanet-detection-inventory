# Runs the checks on every push and pull request: lint, types, the pytest suite (synthetic data,
# no NASA downloads) with coverage, and the star map in a real headless browser.
# Dependencies install from the hash-locked requirements-dev.lock (scripts/tools/lock_requirements.py).
# Actions are pinned to commit SHAs (tag in the comment); Dependabot keeps them up to date.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04   # Playwright has no Chromium build for ubuntu-latest (26.04) yet
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install dependencies (hash-checked)
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .
      - name: Install the headless browser for the star map tests
        run: python -m playwright install --with-deps chromium
      - name: Lint
        run: python -m ruff check scripts tests src app.py
      - name: Type check
        run: python -m mypy src/kepler_cnn scripts app.py
      - name: Run tests with coverage
        run: python -m pytest -q --cov=kepler_cnn --cov-report=term --cov-report=xml
      - name: Check the star map's JavaScript syntax
        run: |
          python scripts/starmap/build_web.py --check
          node --check web/starmap.js && node --check web/data/systems.js

  # The player-account database (supabase/): every migration from scratch, then its pgTAP tests (supabase/tests/).
  # The same pinned CLI as on the owner's PC; nothing here is online and the keys are the CLI's local demo ones.
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Start the local database (migrations run from scratch)
        run: npx --yes supabase@2.122.1 start -x studio,postgres-meta
      - name: Run the database tests
        run: npx --yes supabase@2.122.1 test db
      - name: Stop
        if: always()
        run: npx --yes supabase@2.122.1 stop --no-backup
