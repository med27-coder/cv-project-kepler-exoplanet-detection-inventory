# Runs the checks on every push and pull request: lint, types, the pytest suite (synthetic data,
# no NASA downloads) with coverage, and the star map in a real headless browser.
# Dependencies install from the hash-locked requirements-dev.lock (scripts/tools/lock_requirements.py).
# Actions are pinned to commit SHAs (tag in the comment); Dependabot keeps them up to date.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install dependencies (hash-checked)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .
      - name: Install the headless browser for the star map tests
        run: python -m playwright install --with-deps chromium
      - name: Lint
        run: python -m ruff check scripts tests src app.py
      - name: Type check
        run: python -m mypy src/kepler_cnn scripts app.py
      - name: Run tests with coverage
        run: python -m pytest -q --cov=kepler_cnn --cov-report=term --cov-report=xml
      - name: Check the star map's JavaScript syntax
        run: |
          python scripts/starmap/build_web.py --check
          node --check web/starmap.js && node --check web/data/systems.js
