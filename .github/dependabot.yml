# Dependabot (free): weekly pull requests that update the pinned GitHub Actions; Python
# dependencies get security-fix PRs only. Review and merge them like any other change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  # requirements.txt uses >= ranges, so routine version bumps add nothing. Limit 0 turns them
  # off; security fixes still arrive as PRs via Dependabot security updates (repo setting).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
