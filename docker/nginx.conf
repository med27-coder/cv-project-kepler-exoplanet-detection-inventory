# nginx site for the Kepler Star Map container (docker/web.Dockerfile)
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;                      # don't advertise the nginx version

    # Same strict policy as the <meta> tag in web/index.html, plus headers a meta tag can't set
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: https://alasky.cds.unistra.fr; font-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # starmap.js, style.css and the data files are linked with ?v=<version>, so browsers may cache them
    location ~* \.(js|css|png|gif|jpg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
}