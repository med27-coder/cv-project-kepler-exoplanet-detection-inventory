[project]
name = "kepler-cnn"
version = "3.0.0"
description = "Kepler exoplanet vetting: V2 1D CNN and V3 Star Gazer multi-view model"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 110
# notebooks/*.py are jupytext mirrors of the notebooks (generated; see tests/test_notebooks.py)
extend-exclude = ["notebooks/*.py", "notebooks/archive_colab"]   # + the historical Colab notebooks, kept as they were

[tool.mypy]
ignore_missing_imports = true

[tool.pyright]
# For Claude Code's pyright-lsp plugin (diagnostics after edits). mypy in CI remains the type check of record.
venvPath = "."
venv = ".venv"
include = ["src", "scripts", "tests", "app.py"]
exclude = ["**/__pycache__", "build", "data", "models", "results", "web"]
extraPaths = ["src", "scripts/starmap", "scripts/pipeline", "scripts/experiments", "scripts/tools", "scripts/data"]
typeCheckingMode = "basic"
# Quiet the checks that mostly flag pandas / TensorFlow typing (mypy already accepts this code), keep the rest.
reportOptionalMemberAccess = false
reportOptionalSubscript = false
reportOptionalOperand = false
reportAttributeAccessIssue = "warning"
reportArgumentType = "warning"
