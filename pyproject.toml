[project]
name = "kepler-cnn"
version = "3.0.0"
description = "Kepler exoplanet vetting: V2 1D CNN and V3 Star Gazer multi-view model"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 110
# notebooks/*.py are jupytext mirrors of the notebooks (generated; see tests/test_notebooks.py)
extend-exclude = ["notebooks/*.py", "notebooks/archive_colab"]   # + the historical Colab notebooks, kept as they were

[tool.mypy]
ignore_missing_imports = true
